<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ВЕСЕЛОВА НОЧЬ — Приглашение</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050303;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .invite-wrapper {
            width: 100%;
            max-width: 450px;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(215, 0, 0, 0.2);
        }

        .screen {
            display: none;
            width: 100%;
            position: relative;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .screen.active {
            display: block;
            opacity: 1;
        }

        .invite-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- АНИМАЦИИ НАЛОЖЕНИЯ --- */

        /* 1. Анимированный туман */
        .fog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: radial-gradient(circle, rgba(180, 20, 20, 0.12) 0%, transparent 60%),
                        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.03) 0%, rgba(200, 0, 0, 0.05) 50%, transparent 100%);
            pointer-events: none;
            animation: moveFog 12s linear infinite alternate;
            z-index: 2;
        }

        @keyframes moveFog {
            0% { transform: translateX(0) translateY(0); opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { transform: translateX(-50%) translateY(-20px); opacity: 0.4; }
        }

        /* 2. Парящие летучие мыши и призраки */
        .floating-entity {
            position: absolute;
            pointer-events: none;
            z-index: 3;
            font-size: 22px;
            opacity: 0.6;
            filter: drop-shadow(0 0 8px rgba(215, 0, 0, 0.8));
        }

        .bat-1 {
            top: 18%;
            left: 10%;
            animation: floatBat1 6s ease-in-out infinite alternate;
        }

        .bat-2 {
            top: 25%;
            right: 12%;
            animation: floatBat2 8s ease-in-out infinite alternate;
        }

        .ghost-1 {
            top: 60%;
            left: 8%;
            font-size: 26px;
            animation: floatGhost 7s ease-in-out infinite alternate;
        }

        @keyframes floatBat1 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(30px, -25px) scale(1.15) rotate(12deg); }
        }

        @keyframes floatBat2 {
            0% { transform: translate(0, 0) scale(0.9) rotate(0deg); }
            100% { transform: translate(-35px, 20px) scale(1.1) rotate(-15deg); }
        }

        @keyframes floatGhost {
            0% { transform: translate(0, 0) scale(0.8); opacity: 0.3; }
            50% { opacity: 0.7; }
            100% { transform: translate(20px, -30px) scale(1.1); opacity: 0.3; }
        }

        /* 3. Дышащая и пульсирующая кнопка */
        .btn-target {
            position: absolute;
            bottom: 6.5%; 
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 12%;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 10;
            border-radius: 35px;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 10px rgba(215, 0, 0, 0.3), inset 0 0 5px rgba(255, 255, 255, 0.2);
                transform: translateX(-50%) scale(1);
            }
            50% {
                box-shadow: 0 0 25px rgba(255, 0, 0, 0.85), inset 0 0 12px rgba(255, 255, 255, 0.5);
                transform: translateX(-50%) scale(1.02);
            }
            100% {
                box-shadow: 0 0 10px rgba(215, 0, 0, 0.3), inset 0 0 5px rgba(255, 255, 255, 0.2);
                transform: translateX(-50%) scale(1);
            }
        }

        /* 4. Мембрана мерцания света */
        .flicker-light {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: rgba(215, 0, 0, 0.04);
            z-index: 1;
            animation: flicker 4s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 0.2; }
            3% { opacity: 0.8; }
            6% { opacity: 0.2; }
            7% { opacity: 0.9; }
            8% { opacity: 0.3; }
            50% { opacity: 0.1; }
            52% { opacity: 0.6; }
            54% { opacity: 0.2; }
        }

        /* --- СКРИМЕР --- */
        #screamer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #screamer.active {
            display: flex;
            animation: shake 0.06s infinite;
        }

        .monster-icon {
            width: 85vw;
            max-width: 420px;
            filter: drop-shadow(0 0 50px #D70000);
            animation: zoomMonster 0.15s infinite alternate;
        }

        @keyframes zoomMonster {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        @keyframes shake {
            0% { transform: translate(5px, 5px) rotate(0deg); }
            25% { transform: translate(-5px, -4px) rotate(-2deg); }
            50% { transform: translate(-4px, 5px) rotate(2deg); }
            75% { transform: translate(5px, -3px) rotate(0deg); }
            100% { transform: translate(-3px, 4px) rotate(1deg); }
        }

        /* Искры при клике */
        .spark {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 20px;
            animation: sparkFly 1s forwards ease-out;
        }

        @keyframes sparkFly {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
        }
    </style>
</head>
<body>

    <div class="invite-wrapper">
        <div class="fog-overlay"></div>
        <div class="flicker-light"></div>

        <!-- Анимированные существа -->
        <div class="floating-entity bat-1">🦇</div>
        <div class="floating-entity bat-2">🦇</div>
        <div class="floating-entity ghost-1">👻</div>

        <!-- ЭКРАН 1 -->
        <div id="screen1" class="screen active">
            <div style="position: relative;">
                <img src="start.jpg" alt="Приглашение" class="invite-img">
                <button class="btn-target" onclick="handleClick(event, runScreamer)"></button>
            </div>
        </div>

        <!-- ЭКРАН 2 -->
        <div id="screen2" class="screen">
            <div style="position: relative;">
                <img src="end.jpg" alt="Детали вечеринки" class="invite-img">
                <button class="btn-target" onclick="handleClick(event, accept)"></button>
            </div>
        </div>
    </div>

    <!-- СКРИМЕР -->
    <div id="screamer">
        <svg class="monster-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <rect width="200" height="200" fill="#000"/>
            <circle cx="100" cy="100" r="85" fill="#110505" stroke="#D70000" stroke-width="6"/>
            <polygon points="35,65 75,75 50,105" fill="#FFD186" stroke="#D70000" stroke-width="2"/>
            <polygon points="165,65 125,75 150,105" fill="#FFD186" stroke="#D70000" stroke-width="2"/>
            <circle cx="52" cy="82" r="6" fill="#000"/>
            <circle cx="148" cy="82" r="6" fill="#000"/>
            <path d="M 35 125 Q 100 185 165 125 Q 135 145 100 135 Q 65 145 35 125 Z" fill="#ffffff" stroke="#D70000" stroke-width="2"/>
            <polygon points="60,130 70,155 80,132" fill="#ffffff"/>
            <polygon points="90,132 100,165 110,132" fill="#ffffff"/>
            <polygon points="120,132 130,155 140,130" fill="#ffffff"/>
        </svg>
    </div>

    <script>
        function playScreamSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, ctx.currentTime + 1.3);
                
                gain.gain.setValueAtTime(0.9, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.3);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 1.3);
            } catch(e){}
        }

        function handleClick(e, callback) {
            // Эффект вылетающих искорок при клике
            const symbols = ['🎃', '💥', '✨', '🩸'];
            for (let i = 0; i < 12; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                spark.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                spark.style.left = e.clientX + 'px';
                spark.style.top = e.clientY + 'px';
                
                const dx = (Math.random() - 0.5) * 200 + 'px';
                const dy = (Math.random() - 0.5) * 200 + 'px';
                spark.style.setProperty('--dx', dx);
                spark.style.setProperty('--dy', dy);

                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 1000);
            }

            setTimeout(callback, 200);
        }

        function runScreamer() {
            document.getElementById('screen1').classList.remove('active');
            const sc = document.getElementById('screamer');
            sc.classList.add('active');
            playScreamSound();

            setTimeout(() => {
                sc.classList.remove('active');
                document.getElementById('screen2').classList.add('active');
            }, 1300);
        }

        function accept() {
            alert('Приглашение принято! До встречи на «Веселовой ночи» 🎃');
        }
    </script>
</body>
</html>
