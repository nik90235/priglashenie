<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ВЕСЕЛОВА НОЧЬ — Приглашение</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050303;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .invite-wrapper {
            width: 100%;
            max-width: 450px; /* Ограничение ширины для ПК, чтобы на мониторах макет смотрелся аккуратно */
            position: relative;
            margin: 0 auto;
        }

        .screen {
            display: none;
            width: 100%;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .screen.active {
            display: block;
            opacity: 1;
        }

        /* Картинка масштабируется пропорционально и никогда не обрезается */
        .invite-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Прозрачная кликабельная область точно поверх красной кнопки на картинке */
        .btn-target {
            position: absolute;
            bottom: 6.5%; 
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 12%;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        /* СКРИМЕР */
        #screamer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #screamer.active {
            display: flex;
            animation: shake 0.07s infinite;
        }

        .monster-icon {
            width: 85vw;
            max-width: 400px;
            filter: drop-shadow(0 0 40px #D70000);
        }

        @keyframes shake {
            0% { transform: translate(4px, 4px) rotate(0deg); }
            25% { transform: translate(-4px, -4px) rotate(-1deg); }
            50% { transform: translate(-3px, 4px) rotate(1deg); }
            75% { transform: translate(4px, -2px) rotate(0deg); }
            100% { transform: translate(-2px, 3px) rotate(1deg); }
        }
    </style>
</head>
<body>

    <div class="invite-wrapper">
        <!-- ЭКРАН 1 -->
        <div id="screen1" class="screen active">
            <div style="position: relative;">
                <img src="start.jpg" alt="Приглашение" class="invite-img">
                <button class="btn-target" onclick="runScreamer()"></button>
            </div>
        </div>

        <!-- ЭКРАН 2 -->
        <div id="screen2" class="screen">
            <div style="position: relative;">
                <img src="end.jpg" alt="Детали вечеринки" class="invite-img">
                <button class="btn-target" onclick="accept()"></button>
            </div>
        </div>
    </div>

    <!-- СКРИМЕР СО ЗВУКОМ -->
    <div id="screamer">
        <svg class="monster-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <rect width="200" height="200" fill="#000"/>
            <circle cx="100" cy="100" r="85" fill="#110505" stroke="#D70000" stroke-width="6"/>
            <polygon points="35,65 75,75 50,105" fill="#FFD186" stroke="#D70000" stroke-width="2"/>
            <polygon points="165,65 125,75 150,105" fill="#FFD186" stroke="#D70000" stroke-width="2"/>
            <circle cx="52" cy="82" r="6" fill="#000"/>
            <circle cx="148" cy="82" r="6" fill="#000"/>
            <path d="M 35 125 Q 100 185 165 125 Q 135 145 100 135 Q 65 145 35 125 Z" fill="#ffffff" stroke="#D70000" stroke-width="2"/>
            <polygon points="60,130 70,155 80,132" fill="#ffffff"/>
            <polygon points="90,132 100,165 110,132" fill="#ffffff"/>
            <polygon points="120,132 130,155 140,130" fill="#ffffff"/>
        </svg>
    </div>

    <script>
        function playScreamSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(130, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 1.3);
                
                gain.gain.setValueAtTime(0.8, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.3);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 1.3);
            } catch(e){}
        }

        function runScreamer() {
            document.getElementById('screen1').classList.remove('active');
            const sc = document.getElementById('screamer');
            sc.classList.add('active');
            playScreamSound();

            setTimeout(() => {
                sc.classList.remove('active');
                document.getElementById('screen2').classList.add('active');
            }, 1300);
        }

        function accept() {
            alert('Приглашение принято! Ждем тебя на «Веселовой ночи» 🎃');
        }
    </script>
</body>
</html>
